[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lanerush"
version = "0.1.0"
description = "AI-Driven Adaptive Traffic Signal Control with EV Green Corridor"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "eclipse-sumo",
    "traci",
    "sumolib",
    "libsumo",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "typer>=0.9",
    "pandas>=2.0",
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "redis>=5.0",
    "psycopg[binary]>=3.1",
    "sqlalchemy>=2.0",
    "streamlit>=1.28",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-mock>=3.12",
    "hypothesis>=6.90",
    "ruff>=0.1",
    "mypy>=1.7",
    "pre-commit>=3.6",
]

[project.scripts]
lanerush = "lanerush.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/lanerush"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "sumo: requires SUMO installation",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.mypy]
strict = false
ignore_missing_imports = true
python_version = "3.12"
