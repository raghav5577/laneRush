# Placeholder — generated by `lanerush scan-fixed --seeds 101-105`
# Run that command after SUMO is installed to populate the best fixed-timer split.
mode: fixed_tuned

sim:
  sumo_binary: sumo
  net_file: scenarios/grid3x3/grid3x3.net.xml
  route_file: scenarios/grid3x3/grid3x3.rou.xml
  step_length: 1.0
  max_steps: 3600
  seed: 1
  gui: false

tls:
  min_green: 8
  max_green: 50
  yellow_wait: 3

scoring:
  w_count: 1.0
  w_halt: 1.0
  w_age: 0.5

corridor:
  enabled: false
  lookahead_junctions: 3
  eta_threshold_base: 12.0
  hold_until_passed: true

perception:
  provider: ground_truth
  noisy:
    recall: 0.9
    false_alarm: 0.05
    ev_recall: 0.95
    ev_false_alarm: 0.01
    confirmation_k: 2
    confirmation_n: 3

store:
  backend: memory
  redis_url: "redis://localhost:6379/0"
  pg_dsn: "postgresql://lanerush:lanerush@localhost:5432/lanerush"
  batch_every_steps: 50

output:
  runs_dir: runs
  log_decisions_every_n: 10
