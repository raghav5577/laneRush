corridor:
  enabled: false
  eta_threshold_base: 12.0
  hold_until_passed: true
  lookahead_junctions: 3
mode: fixed_tuned
output:
  log_decisions_every_n: 10
  runs_dir: runs
perception:
  noisy:
    confirmation_k: 2
    confirmation_n: 3
    ev_false_alarm: 0.01
    ev_recall: 0.95
    false_alarm: 0.05
    recall: 0.9
  provider: ground_truth
scoring:
  w_age: 0.5
  w_count: 1.0
  w_halt: 1.0
sim:
  gui: false
  max_steps: 3600
  net_file: scenarios/grid3x3/grid3x3.net.xml
  route_file: scenarios/grid3x3/grid3x3.rou.xml
  seed: 1
  step_length: 1.0
  sumo_binary: sumo
store:
  backend: memory
  batch_every_steps: 50
  pg_dsn: postgresql://lanerush:lanerush@localhost:5432/lanerush
  redis_url: redis://localhost:6379/0
tls:
  max_green: 54
  min_green: 30
  yellow_wait: 3
