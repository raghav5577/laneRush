services:
  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  postgres:
    image: postgres:16
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lanerush}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lanerush_secret}
      POSTGRES_DB: ${POSTGRES_DB:-lanerush}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./src/lanerush/store/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lanerush"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  pgdata:
